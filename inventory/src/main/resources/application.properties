spring.application.name=inventory
# Local laboratory administrator; environment variables can override these credentials.
BOOTSTRAP_ADMIN_EMAIL=${ADMIN_EMAIL:admin@techstore.test}
BOOTSTRAP_ADMIN_PASSWORD=${ADMIN_PASSWORD:TechStore1!}
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:h2:mem:techstore}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
app.inventory.demo-data=${DEMO_INVENTORY_ENABLED:true}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
# Development default only; supply a random secret of at least 32 bytes outside the lab.
app.jwt.secret=${JWT_SECRET:techstore-clave-super-secreta-de-al-menos-32-caracteres-123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
